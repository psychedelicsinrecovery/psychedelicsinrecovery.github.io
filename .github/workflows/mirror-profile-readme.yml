name: Mirror org profile README

# Keeps this repo's root README.md in sync with the org's public profile README
# (psychedelicsinrecovery/.github/profile/README.md) — no cross-repo token/secret needed, since
# this fetches the OTHER repo's raw content (public, unauthenticated) and only ever writes to
# ITS OWN repo. Runs on a daily schedule and can be triggered manually; not instant, but simple
# and secret-free. See ~/code/drasticstatic/how-to-establish-an-ORGANIZATION'S-github.md for the
# full write-up of why this shape was chosen.

on:
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest profile README and build mirror
        run: |
          set -euo pipefail
          curl -sL --fail \
            "https://raw.githubusercontent.com/psychedelicsinrecovery/.github/main/profile/README.md" \
            -o profile-readme.md

          {
            echo "<!-- AUTO-GENERATED MIRROR — do not edit this file directly."
            echo "     Source of truth: https://github.com/psychedelicsinrecovery/.github/blob/main/profile/README.md"
            echo "     This copy refreshes daily via .github/workflows/mirror-profile-readme.yml -->"
            echo ""
            cat profile-readme.md
          } > README.md.new
          rm profile-readme.md

      - name: Commit if changed
        run: |
          set -euo pipefail
          if ! diff -q README.md README.md.new > /dev/null 2>&1; then
            mv README.md.new README.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: sync README from org profile (automated)"
            git push
          else
            echo "No change — profile README is already in sync."
            rm -f README.md.new
          fi
